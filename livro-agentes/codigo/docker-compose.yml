name: livro-agentes
services:
  banco:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: livro
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  ollama:
    image: ollama/ollama
    volumes:
      - dados_ollama:/root/.ollama
  app:
    build: .
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    depends_on:
      banco:
        condition: service_healthy
      ollama:
        condition: service_started
volumes:
  dados_banco:
  dados_ollama:
